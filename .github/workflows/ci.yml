name: CI

# Real addition (2026-08-06, code-quality audit) - this repo had no CI
# config at all before this, across 38+ commits. Two independent jobs
# (backend/frontend) since they have separate dependency manifests and
# nothing shared to gate on the other failing.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storybook
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: storybook/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Run frontend unit tests
        run: npm test
      - name: Install Playwright browser (Storybook tests)
        run: npx playwright install --with-deps chromium
      - name: Run Storybook browser tests
        run: npm run test:storybook
